name: sync-race-events

# 대회 일정 자동 동기화 — race_events 테이블을 주기적으로 멱등 upsert.
# 소스 우선순위: HYROX_RESULT_API_TOKEN(Result API 구독) → HYROX_EVENTS_API_URL
# → supabase/data/race-events.json (큐레이션 폴백).
# 필요한 시크릿: SUPABASE_SERVICE_ROLE_KEY (서버 전용). 선택: HYROX_RESULT_API_TOKEN.
on:
  schedule:
    - cron: "0 6 * * 1" # 매주 월요일 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "매핑 확인만 (DB 미반영, API 스펙·샘플 로그 덤프)"
        type: boolean
        default: false
      api_token:
        description: "임시 Result API 토큰 (시크릿 미등록 시 1회용 — 평시엔 비워둘 것)"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "supabase/data/race-events.json"
      - "scripts/sync-race-events.mjs"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync race events
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HYROX_EVENTS_API_URL: ${{ secrets.HYROX_EVENTS_API_URL }}
          HYROX_RESULT_API_TOKEN: ${{ secrets.HYROX_RESULT_API_TOKEN || inputs.api_token }}
          SYNC_DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: |
          if [ -n "$HYROX_RESULT_API_TOKEN" ]; then
            echo "::add-mask::$HYROX_RESULT_API_TOKEN"
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -z "$SYNC_DRY_RUN" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY not set — skipping sync."
            exit 0
          fi
          node scripts/sync-race-events.mjs
