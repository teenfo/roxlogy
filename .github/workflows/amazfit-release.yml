name: amazfit-release

# Zepp OS(.zab) 빌드 + Supabase 공개 스토리지 게시.
# zeus build 는 docs.zepp.com 에서 기기 목록을 받아오므로 네트워크가 필요하다(CI 는 가능).
# 다운로드 페이지(web/lib/app-links.ts)가 roxlogy-amazfit-latest.zab 를 가리킨다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "amazfit/**"
      - ".github/workflows/amazfit-release.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amazfit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Link zeus private module
        # zeus-cli 는 내부 의존성 zeppos-app-utils 를 npm 에 공개하지 않고 패키지 안
        # private-modules/ 에 담아 배포한다(선언 누락 패키징 버그). npm 레지스트리의
        # 동명 서드파티 패키지는 exports 가 달라 "devicesData is not a function" 이 난다.
        # → 패키지 내장본을 node_modules 에 심링크 (zepp-health/discussions#350 공식 우회).
        run: |
          rm -rf node_modules/zeppos-app-utils
          ln -s @zeppos/zeus-cli/private-modules/zeppos-app-utils node_modules/zeppos-app-utils
          node -e "console.log('app-utils modules:', Object.keys(require('zeppos-app-utils').modules).join(','))"

      - name: Build .zab
        run: npx zeus build

      - name: Dump valid device target names (참고용)
        # zeus 가 받아온 기기 목록 — app.json targets 이름 조정에 사용.
        if: always()
        run: |
          node -e "
            const fs = require('fs'), os = require('os'), path = require('path');
            const p = path.join(os.homedir(), '.zepp/.zeus_devices');
            if (!fs.existsSync(p)) { console.log('no device cache'); process.exit(0); }
            try {
              const d = JSON.parse(fs.readFileSync(p, 'utf8'));
              const list = Array.isArray(d) ? d : (d.data || d.devices || Object.values(d)[0] || []);
              const names = [...new Set((Array.isArray(list) ? list : []).flatMap(x => [x.name, x.deviceName, x.target]).filter(Boolean))];
              console.log(names.join('\n') || JSON.stringify(d).slice(0, 3000));
            } catch (e) { console.log(fs.readFileSync(p, 'utf8').slice(0, 3000)); }
          "

      - name: Locate artifact
        id: zab
        run: |
          ZAB="$(find . -name '*.zab' -not -path './node_modules/*' | head -1)"
          if [ -z "$ZAB" ]; then
            echo "::error::no .zab produced"; exit 1
          fi
          echo "path=$ZAB" >> "$GITHUB_OUTPUT"
          echo "built: $ZAB ($(wc -c < "$ZAB") bytes)"

      - name: Upload to Supabase Storage (public)
        env:
          SR: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BASE: https://vuloxbpfhyqkvgmpmkst.supabase.co/storage/v1/object/app-downloads
          RUN_NO: ${{ github.run_number }}
          ZAB: ${{ steps.zab.outputs.path }}
        run: |
          if [ -z "$SR" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY not set — skipping publish."
            exit 0
          fi
          VER="$(node -p "require('./package.json').version")"
          upload() {
            curl -sSf -X POST \
              -H "Authorization: Bearer $SR" -H "apikey: $SR" \
              -H "x-upsert: true" -H "Content-Type: application/octet-stream" \
              --data-binary "@$ZAB" "$BASE/$1" > /dev/null
            echo "uploaded $1"
          }
          upload "roxlogy-amazfit-v${VER}-${RUN_NO}.zab"
          upload "roxlogy-amazfit-latest.zab"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: roxlogy-amazfit-zab
          path: amazfit/**/*.zab
          if-no-files-found: error
